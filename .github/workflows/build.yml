name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Derle
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK'yı yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk EkranAsistani.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest EkranAsistani.apk \
            --title "Ekran Asistanı (son sürüm)" \
            --notes "Telefondan indirip kur. Commit: ${{ github.sha }}" \
            --target "${{ github.sha }}"
