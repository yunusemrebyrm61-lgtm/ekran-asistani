name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Derle
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK'yı yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk EkranAsistani.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest EkranAsistani.apk \
            --title "Ekran Asistanı (son sürüm)" \
            --notes "Telefondan indirip kur. Commit: ${{ github.sha }}" \
            --target "${{ github.sha }}"

      # Yedek indirme linki: APK'yı ayrı "apk" dalına da koy (raw.githubusercontent.com üzerinden iner).
      - name: APK'yı apk dalına koy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/apkdal && cp EkranAsistani.apk /tmp/apkdal/
          cd /tmp/apkdal
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add EkranAsistani.apk
          git commit -qm "APK ${{ github.sha }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" apk
